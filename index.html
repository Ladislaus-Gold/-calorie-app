<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <script>try{var p=localStorage.getItem("theme")||"auto";document.documentElement.dataset.theme=(p==="dark"||(p==="auto"&&window.matchMedia("(prefers-color-scheme: dark)").matches))?"dark":"light"}catch(e){}</script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Health">
  <meta name="app-label" content="2.57">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=7">
  <link rel="icon" type="image/png" href="icon-192.png?v=7">
  <title>Health</title>
  <link rel="stylesheet" href="style.css?v=189">
  <link rel="stylesheet" href="bw.css?v=33">
</head>
<body>

  <!-- Экран входа -->
  <section id="login" class="login hidden">
    <div class="login-hero">
      <img src="icon-192.png?v=7" alt="" class="login-logo" width="96" height="96">
      <h1>Health</h1>
      <p>Питание, вода и нагрузки в одном месте. Вводите граммы, а калории и БЖУ посчитаются сами.</p>
    </div>
    <div class="login-actions">
      <button id="btn-login" class="btn primary full" type="button">Войти через Google</button>
      <p id="login-error" class="login-error" role="alert"></p>
    </div>
  </section>

  <!-- Основное приложение -->
  <div id="app" class="hidden">
    <main id="view" class="view"></main>

    <nav id="nav" class="nav" aria-label="Разделы">
      <button type="button" data-tab="diary" class="nav-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M8 4v13"/></svg>
        <span>Дневник</span>
      </button>
      <button type="button" data-tab="products" class="nav-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h16l-1.5 10h-13z"/><path d="M8 9l3-5M16 9l-3-5"/></svg>
        <span>Продукты</span>
      </button>
      <button type="button" data-tab="health" class="nav-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
        <span>Здоровье</span>
      </button>
      <button type="button" data-tab="reports" class="nav-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>
        <span>Отчёты</span>
      </button>
      <button type="button" data-tab="me" class="nav-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>
        <span>Я</span>
      </button>
    </nav>
  </div>

  <div id="loading" class="loading hidden"><div class="spinner" aria-label="Загрузка"></div></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js?v=260"></script>
</body>
</html>
